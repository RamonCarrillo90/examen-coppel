# =============================================================================
# Nginx: sirve la app de Angular y reenvía /api al backend en Go.
# Así el navegador solo habla con un origen (http://localhost) y no hay CORS.
# =============================================================================

# Límite de peticiones al login: 5 por minuto por IP (con una ráfaga de 5).
# Frena ataques de fuerza bruta sin tocar el código de Go.
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Comprimir respuestas de texto: los .js de Angular pesan mucho menos.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Encabezados de seguridad básicos.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- Login con límite de peticiones ---
    location = /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://api:8080;
        include /etc/nginx/proxy_params_app.conf;
    }

    # --- API: todo lo que empiece con /api va al contenedor de Go ---
    location /api/ {
        proxy_pass http://api:8080;
        include /etc/nginx/proxy_params_app.conf;
    }

    # --- Archivos de Angular con hash en el nombre: caché de un año ---
    # (main-QUVKGI42.js cambia de nombre en cada build, así que es seguro).
    location ~* \.(?:js|css|woff2?|png|jpg|svg|ico)$ {
        expires 1y;
        try_files $uri =404;
    }

    # --- Rutas de Angular ---
    # /usuarios/5 no es un archivo real: si no existe, se entrega index.html
    # y el router de Angular decide qué pantalla mostrar.
    location / {
        try_files $uri $uri/ /index.html;
        # index.html nunca se guarda en caché: así siempre apunta a los .js nuevos.
        expires -1;
    }
}