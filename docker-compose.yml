# =============================================================================
# Orquestación de todos los servicios del proyecto.
# Uso:  docker compose up --build
#
# Orden de arranque (garantizado con depends_on + condiciones):
#   db (sano) -> migrate (terminó bien) -> api
# Próximamente: web (Angular servido por Nginx, que además hará de reverse proxy).
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # Base de datos PostgreSQL
  # ---------------------------------------------------------------------------
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # Volumen con nombre: los datos sobreviven aunque se borre el contenedor.
      - pgdata:/var/lib/postgresql/data
    ports:
      # Solo en 127.0.0.1: accesible desde tu PC (DataGrip, psql) pero no desde
      # otras máquinas de la red.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      # pg_isready responde OK cuando Postgres ya acepta conexiones.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---------------------------------------------------------------------------
  # Migraciones: aplica los archivos de backend/migrations y termina.
  # ---------------------------------------------------------------------------
  migrate:
    image: migrate/migrate:v4.18.3
    volumes:
      - ./backend/migrations:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable"
      - "up"
    depends_on:
      db:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # API REST en Go
  # ---------------------------------------------------------------------------
  api:
    build: ./backend
    restart: unless-stopped
    environment:
      PORT: "8080"
      # "db" es el nombre del servicio: Docker lo resuelve como hostname
      # dentro de la red interna del compose.
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable"
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    ports:
      # Expuesto temporalmente para probar con Postman/curl.
      # Cuando agreguemos Nginx, la API solo será accesible a través de él.
      - "127.0.0.1:8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  pgdata:
